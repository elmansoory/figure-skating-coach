kind = "web"
previewPath = "/"
title = "Figure Skating Coach Pro"
version = "1.0.0"
id = "artifacts/figure-skating-coach"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22761

[services.development]
run = "pnpm --filter @workspace/figure-skating-coach run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/figure-skating-coach", "run", "build" ]
publicDir = "artifacts/figure-skating-coach/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22761"
BASE_PATH = "/"
